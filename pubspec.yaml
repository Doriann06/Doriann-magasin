name: article_liste
description: Projet Flutter pour afficher une liste d'articles avec des fonctionnalités de navigation, de stockage local et de gestion d'état.

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  go_router: ^17.1.0
  http: ^1.1.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  cached_network_image: ^3.3.0

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
